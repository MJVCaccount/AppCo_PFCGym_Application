name: CI

# Every change is checked before it merges (pull requests) and again once it
# lands (pushes to develop and main). deploy.yml starts only when this
# workflow finishes successfully for a push.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A newer push to the same branch or pull request makes the older run
# pointless, so it is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    # Placeholders only: the build does not connect to a database, and
    # nothing here is a real credential.
    env:
      SESSION_SECRET: ci-placeholder-session-secret-40-chars-0
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest

    # The app runs on Node 20 (Vercel) and is checked on Node 24 as well, so a
    # runtime upgrade does not arrive as a surprise.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    # A throwaway Postgres for this job only. Tests never touch Neon in CI:
    # nothing here holds a Neon address.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pfc_ci_password
          POSTGRES_DB: pfc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The test helper (tests/helpers/db.ts) refuses to run when
    # TEST_DATABASE_URL names the same database as DATABASE_URL or DIRECT_URL,
    # because the tests empty every table. So the app URLs name a second
    # database, pfc_app, on the same container; `migrate deploy` below proves
    # the migrations apply to an empty database, and the tests use pfc_test.
    env:
      SESSION_SECRET: ci-placeholder-session-secret-40-chars-0
      DATABASE_URL: postgresql://postgres:pfc_ci_password@localhost:5432/pfc_app
      DIRECT_URL: postgresql://postgres:pfc_ci_password@localhost:5432/pfc_app
      TEST_DATABASE_URL: postgresql://postgres:pfc_ci_password@localhost:5432/pfc_test
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - name: Create the app and shadow databases
        run: |
          psql "postgresql://postgres:pfc_ci_password@localhost:5432/pfc_test" -c 'CREATE DATABASE pfc_app'
          psql "postgresql://postgres:pfc_ci_password@localhost:5432/pfc_test" -c 'CREATE DATABASE pfc_shadow'

      - name: Apply migrations
        run: npx prisma migrate deploy

      # The migrations and schema.prisma must describe the same database. A
      # change to one without the other fails here, not in production.
      - name: Migration drift check
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://postgres:pfc_ci_password@localhost:5432/pfc_shadow
          --exit-code

      # Seeds the freshly migrated database and checks every integrity rule
      # (prisma/verifyIntegrity.ts). Read-only after the seed.
      - name: Seed and verify database integrity
        env:
          SEED_ALLOWED_HOSTS: localhost
        run: |
          npx prisma db seed
          npm run db:verify

      # Node 24 also produces the coverage report; Node 20 runs the plain suite.
      - name: Tests
        if: matrix.node != 24
        run: npm test

      - name: Tests with coverage
        if: matrix.node == 24
        run: npm run coverage

      - name: Keep the coverage report
        if: matrix.node == 24 && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-src-lib
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  # The API description must be valid OpenAPI 3.1, and the JSON copy the app
  # serves must be the YAML. tests/openapi.test.ts (in the test job) checks the
  # spec against the code and against real responses.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run openapi:lint
      - name: The served JSON is up to date
        run: |
          npm run openapi:build
          git diff --exit-code src/lib/openapi.json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails on a high or critical advisory in anything that ships. The
      # "overrides" in package.json pin postcss (bundled inside next) and
      # deepmerge-ts (inside prisma's config loader) to patched releases.
      - run: npm audit --omit=dev --audit-level=high

  # Every commit in the history, not only the working tree. Findings that were
  # reviewed and are not secrets are listed with a reason in .gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The container runs as root and the checkout belongs to the runner, so
      # git must be told the directory is safe (it would refuse otherwise).
      - name: Scan the full history
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  # Semgrep OSS with the registry packs for TypeScript, Next.js, the OWASP top
  # ten and secrets. Metrics are off: nothing about the code is sent anywhere.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan --metrics=off --error --no-git-ignore \
            --config p/typescript --config p/nextjs --config p/owasp-top-ten --config p/secrets \
            --exclude node_modules --exclude .next --exclude coverage --exclude "*.svg" \
            --exclude docs/api.html --exclude package-lock.json --exclude .git
