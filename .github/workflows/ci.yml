name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Throwaway database for the test step. Nothing outside this job can
    # reach it and it is discarded when the job ends.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pfc_test
          POSTGRES_DB: pfc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
        env:
          SESSION_SECRET: ci-placeholder-secret
          TEST_DATABASE_URL: postgresql://postgres:pfc_test@localhost:5432/pfc_test

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-placeholder-secret
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
